onboarding = false
# herdr configuration — mirrors ~/.config/tmux/tmux.conf where herdr has an equivalent.
# Full reference: herdr --default-config

[terminal]
default_shell = "/bin/zsh"

# New panes/tabs/workspaces open in the source pane's cwd,
# like `split-window -c "#{pane_current_path}"`
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# Split right with \ and down with -, as in tmux
split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

# Maximize/zoom the focused pane with m (tmux: bind -r m resize-pane -Z)
zoom = "prefix+m"

# Swapped from herdr's defaults: navigate mode on s, settings on g
goto = "prefix+s"
settings = "prefix+g"

# Detach on d as in tmux (herdr defaults to prefix+q, which is display-panes
# in tmux). Note close_workspace is prefix+shift+d, one slipped Shift away —
# don't set ui.confirm_close = false without rethinking this.
detach = "prefix+d"

# lazygit in a temporary pane that closes when lazygit exits
[[keys.command]]
key = "prefix+shift+l"
type = "pane"
command = "lazygit"

[ui]
# tmux never asks for a window name on creation, and the aarsh21.tab-title plugin
# only manages tabs still carrying herdr's generated numeric label — a name typed
# at the prompt counts as a manual rename and is left alone forever.
prompt_new_tab_name = false

[advanced]
# tmux keeps 1,000,000 lines of history; raise herdr's 10MB default to match intent
scrollback_limit_bytes = 50000000

[theme]
name = "catppuccin"
auto_switch = false
